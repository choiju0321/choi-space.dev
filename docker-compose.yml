services:
  postgres:
    image: postgres:16-alpine
    container_name: choi-space-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: choi
      POSTGRES_PASSWORD: choi
      POSTGRES_DB: choi_space
    volumes:
      - choi_space_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choi -d choi_space"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  choi_space_pg:
